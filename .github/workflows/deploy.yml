name: Deploy to Timeweb VDS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  SERVER_IP: 186.246.29.40
  SERVER_USER: root
  APP_DIR: /opt/yclients-mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} << 'ENDSSH'
            set -e

            # Install Docker if needed
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              systemctl enable docker
              systemctl start docker
            fi

            # Install docker-compose if needed
            if ! command -v docker-compose &> /dev/null; then
              curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              chmod +x /usr/local/bin/docker-compose
            fi

            # Clone or pull
            if [ -d "${{ env.APP_DIR }}" ]; then
              cd ${{ env.APP_DIR }}
              git pull origin ${{ env.BRANCH || 'master' }}
            else
              git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ${{ env.APP_DIR }}
              cd ${{ env.APP_DIR }}
            fi

            # Deploy with compose
            export YCLIENTS_PARTNER_TOKEN="${{ secrets.YCLIENTS_PARTNER_TOKEN }}"
            export YCLIENTS_USER_TOKEN="${{ secrets.YCLIENTS_USER_TOKEN }}"
            export MCP_API_KEY="${{ secrets.MCP_API_KEY }}"

            docker-compose down --remove-orphans
            docker-compose up -d --build
            docker image prune -f

            echo "Deployment completed!"
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ env.SERVER_IP }}/ || exit 1
          echo "Health check passed!"
